<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Faithful Hound Trout Farm</title>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh;}
.app{max-width:720px;margin:0 auto;padding:0 0 3rem;background:#fff;min-height:100vh;box-shadow:0 0 0 0.5px #e2e8f0;}
button{font-family:inherit;cursor:pointer;border-radius:6px;border:0.5px solid #cbd5e1;background:transparent;color:#475569;font-size:13px;padding:5px 10px;}
button:hover{background:#f1f5f9;}
input,select,textarea{font-family:inherit;font-size:13px;border:0.5px solid #cbd5e1;border-radius:6px;padding:7px 10px;width:100%;outline:none;background:#fff;color:#1e293b;}
input:focus,select:focus,textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 2px #dbeafe;}
.header{padding:1rem 1rem 0;}
.header h1{font-size:17px;font-weight:600;}
.header-sub{font-size:12px;color:#64748b;margin-top:2px;display:flex;align-items:center;gap:8px;}
.owner-pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px;}
.pill{font-size:12px;padding:4px 12px;border-radius:20px;cursor:pointer;border:0.5px solid #cbd5e1;}
.tabs{display:flex;border-bottom:0.5px solid #e2e8f0;overflow-x:auto;}
.tab{font-size:13px;padding:8px 12px;border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;white-space:nowrap;}
.tab.active{border-bottom-color:#1e293b;font-weight:500;color:#1e293b;}
.content{padding:1rem;}
.card{background:#fff;border:0.5px solid #e2e8f0;border-radius:8px;padding:10px 14px;margin-bottom:8px;}
.badge{font-size:11px;border-radius:10px;padding:1px 7px;display:inline-flex;align-items:center;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:999;padding:1rem;}
.modal{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:1.5rem;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;}
.modal.wide{max-width:440px;}
.avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex-shrink:0;}
.toast{position:fixed;top:12px;right:12px;z-index:9999;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:500;max-width:280px;}
.live{font-size:11px;}.live.ok{color:#059669;}.live.saving{color:#d97706;}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.filters select{width:auto;}
.expense-row{border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.empty{text-align:center;padding:2rem 1rem;color:#94a3b8;font-size:14px;}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.summary-card{border-radius:8px;padding:10px 14px;}
.slip-thumb{width:52px;height:52px;object-fit:cover;border-radius:6px;border:0.5px solid #e2e8f0;cursor:pointer;flex-shrink:0;}
.slip-upload-area{border:1.5px dashed #cbd5e1;border-radius:8px;padding:12px;text-align:center;cursor:pointer;background:#f8fafc;margin-bottom:4px;}
.slip-upload-area:hover{border-color:#93c5fd;background:#eff6ff;}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px;}
@media(max-width:500px){.card-actions{flex-wrap:wrap;}}
</style>
</head>
<body>
<div class="app" id="app">
<div class="empty" style="padding:3rem"><div style="font-size:28px;margin-bottom:8px">&#x1F3A3;</div><p>Loading farm data...</p></div>
</div>
<script>

const OWNERS=[{id:"kevin",name:"Kevin Bassett",color:"#4F46E5"},{id:"steve",name:"Steve Robinson",color:"#0891B2"},{id:"brandon",name:"Brandon Zietsman",color:"#059669"},{id:"mark",name:"Mark Barnes",color:"#D97706"},{id:"graham",name:"Graham Leith",color:"#DC2626"},{id:"ralph",name:"Ralph Milton",color:"#7C3AED"}];
const OID=["kevin","steve","brandon","mark","graham","ralph"];
const DEFAULT_PINS={kevin:"1111",steve:"2222",brandon:"3333",mark:"4444",graham:"5555",ralph:"6666"};
const ADMIN_ID="steve";
const CATS=["general","fuel","groceries","labour","equipment","maintenance","other"];
const HOLIDAYS={"01-01":"New Year's Day","03-21":"Human Rights Day","04-27":"Freedom Day","05-01":"Workers Day","06-16":"Youth Day","08-09":"Women's Day","09-24":"Heritage Day","12-16":"Day of Reconciliation","12-25":"Christmas","12-26":"Day of Goodwill"};
const RAW=[[22,"2025-05-03","2025-05-10","2025-05-17","2025-05-24","2025-05-31","2025-06-07"],[23,"2025-06-14","2025-06-21","2025-06-28","2025-07-05","2025-07-12","2025-07-19"],[24,"2025-07-26","2025-08-02","2025-08-09","2025-08-16","2025-08-23","2025-08-30"],[25,"2025-09-06","2025-09-13","2025-09-27","2025-09-20","2025-10-04","2025-10-11"],[26,"2025-10-18","2025-10-25","2025-11-01","2025-11-08","2025-11-15","2025-11-22"],[27,"2025-11-29","2025-12-06","2025-12-13","2025-12-20","2025-12-27","2026-01-03"],[28,"2026-01-10","2026-01-17","2026-01-24","2026-01-31","2026-02-07","2026-02-14"],[29,"2026-02-21","2026-02-28","2026-03-07","2026-03-14","2026-03-21","2026-03-28"],[30,"2026-04-04","2026-04-25","2026-04-11","2026-04-18","2026-05-02","2026-05-09"],[31,"2026-05-16","2026-05-23","2026-05-30","2026-06-06","2026-06-13","2026-06-20"],[32,"2026-06-27","2026-07-04","2026-07-11","2026-07-18","2026-07-25","2026-08-01"],[33,"2026-08-08","2026-08-15","2026-08-22","2026-08-29","2026-09-05","2026-09-12"],[34,"2026-09-19","2026-09-26","2026-10-03","2026-10-10","2026-10-17","2026-10-24"],[35,"2026-10-31","2026-11-07","2026-11-14","2026-11-21","2026-11-28","2026-12-05"],[36,"2026-12-12","2026-12-19","2026-12-26","2027-01-02","2027-01-09","2027-01-16"],[37,"2027-01-23","2027-01-30","2027-02-06","2027-02-13","2027-02-20","2027-02-27"],[38,"2027-03-06","2027-03-13","2027-03-20","2027-03-27","2027-04-03","2027-04-10"],[39,"2027-04-17","2027-04-24","2027-05-01","2027-05-08","2027-05-15","2027-05-22"],[40,"2027-05-29","2027-06-05","2027-06-12","2027-06-19","2027-06-26","2027-07-03"],[41,"2027-07-10","2027-07-17","2027-07-24","2027-07-31","2027-08-07","2027-08-14"],[42,"2027-08-21","2027-08-28","2027-09-04","2027-09-11","2027-09-18","2027-09-25"],[43,"2027-10-02","2027-10-09","2027-10-16","2027-10-23","2027-10-30","2027-11-06"],[44,"2027-11-13","2027-11-20","2027-11-27","2027-12-04","2027-12-11","2027-12-18"],[45,"2027-12-25","2028-01-01","2028-01-08","2028-01-15","2028-01-22","2028-01-29"],[46,"2028-02-05","2028-02-12","2028-02-19","2028-02-26","2028-03-04","2028-03-11"],[47,"2028-03-18","2028-03-25","2028-04-01","2028-04-08","2028-04-15","2028-04-22"],[48,"2028-04-29","2028-05-06","2028-05-13","2028-05-20","2028-05-27","2028-06-03"],[49,"2028-06-10","2028-06-17","2028-06-24","2028-07-01","2028-07-08","2028-07-15"],[50,"2028-07-22","2028-07-29","2028-08-05","2028-08-12","2028-08-19","2028-08-26"],[51,"2028-09-02","2028-09-09","2028-09-16","2028-09-23","2028-09-30","2028-10-07"],[52,"2028-10-14","2028-10-21","2028-10-28","2028-11-04","2028-11-11","2028-11-18"],[53,"2028-11-25","2028-12-02","2028-12-09","2028-12-16","2028-12-23","2028-12-30"],[54,"2029-01-06","2029-01-13","2029-01-20","2029-01-27","2029-02-03","2029-02-10"],[55,"2029-02-17","2029-02-24","2029-03-03","2029-03-10","2029-03-17","2029-03-24"],[56,"2029-04-07","2029-03-31","2029-04-14","2029-04-21","2029-04-28","2029-05-05"],[57,"2029-05-12","2029-05-19","2029-05-26","2029-06-02","2029-06-09","2029-06-16"],[58,"2029-06-23","2029-06-30","2029-07-07","2029-07-14","2029-07-21","2029-07-28"],[59,"2029-08-04","2029-08-11","2029-08-18","2029-08-25","2029-09-01","2029-09-08"],[60,"2029-09-15","2029-09-22","2029-09-29","2029-10-06","2029-10-13","2029-10-20"],[61,"2029-10-27","2029-11-03","2029-11-10","2029-11-17","2029-11-24","2029-12-01"],[62,"2029-12-08","2029-12-15","2029-12-22","2029-12-29","2030-01-05","2030-01-12"],[63,"2030-01-19","2030-01-26","2030-02-02","2030-02-09","2030-02-16","2030-02-23"]];
const ALL_WEEKENDS=RAW.flatMap(([rnd,...dates])=>OID.map((oid,i)=>({id:`${rnd}-${oid}`,round:rnd,origOwner:oid,date:dates[i]}))).sort((a,b)=>a.date.localeCompare(b.date));
function nearHoliday(d){const dt=new Date(d+"T00:00:00");for(let i=-1;i<=2;i++){const c=new Date(dt);c.setDate(dt.getDate()+i);const k=String(c.getMonth()+1).padStart(2,"0")+"-"+String(c.getDate()).padStart(2,"0");if(HOLIDAYS[k])return HOLIDAYS[k];}return null;}
function fmt(d){return new Date(d+"T00:00:00").toLocaleDateString("en-ZA",{day:"numeric",month:"short",year:"numeric"});}
function avatar(name,color,size){size=size||28;return'<div class="avatar" style="width:'+size+'px;height:'+size+'px;background:'+color+';font-size:'+(size<30?10:12)+'px">'+name.split(" ").map(n=>n[0]).join("")+'</div>';}
let STATE={},PINS={...DEFAULT_PINS},currentUser=null,currentTab="all",filterOwner="all",filterYear="all",syncing=false,lastSync=null,expFilter="pending",showCover=true;
let _pendingSlip=null;
firebase.initializeApp(firebaseConfig);
const db=firebase.database(),stateRef=db.ref("farmState"),pinsRef=db.ref("farmPins");
stateRef.on("value",snap=>{const val=snap.val();if(val)STATE=val;if(!showCover)render();});
pinsRef.on("value",snap=>{const val=snap.val();if(val)PINS=val;});
function getS(id){return STATE[id]||{going:null,available:false,claimedBy:null,reallocTo:null,comments:[],expenses:[]};}
async function patchState(id,p){const u={...getS(id),...p};STATE[id]=u;syncing=true;render();await stateRef.child(id).set(u);syncing=false;lastSync=new Date();render();}
async function savePins(u){PINS=u;await pinsRef.set(u);}
function effOwner(id){const s=getS(id);if(s.reallocTo)return s.reallocTo;if(s.claimedBy)return s.claimedBy;return ALL_WEEKENDS.find(x=>x.id===id)?.origOwner||null;}
const today=new Date().toISOString().split("T")[0];
function showToast(msg,type){type=type||"ok";const e=document.getElementById("toast");if(e)e.remove();const el=document.createElement("div");el.id="toast";el.className="toast";el.style.background=type==="ok"?"#dcfce7":"#fee2e2";el.style.color=type==="ok"?"#166534":"#991b1b";el.style.border="0.5px solid "+(type==="ok"?"#86efac":"#fca5a5");el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3500);}
function closeModal(){const m=document.getElementById("modal-overlay");if(m)m.remove();}
function openModal(html){closeModal();const o=document.createElement("div");o.className="modal-overlay";o.id="modal-overlay";o.innerHTML=html;o.addEventListener("click",e=>{if(e.target===o)closeModal();});document.body.appendChild(o);}
function openLightbox(src){const lb=document.createElement("div");lb.className="lightbox";lb.onclick=()=>lb.remove();lb.innerHTML='<img src="'+src+'" alt="Slip"/>';document.body.appendChild(lb);}
function handleSlipFile(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(ev){_pendingSlip=ev.target.result;const area=document.getElementById("slip-upload-area");if(area){area.style.borderColor="#86efac";area.style.background="#f0fdf4";area.innerHTML='<img src="'+_pendingSlip+'" style="max-height:100px;max-width:100%;border-radius:6px;display:block;margin:0 auto 4px"/><p style="font-size:11px;color:#059669;margin:0">Slip attached \u2713 Tap to change</p>';area.onclick=function(){document.getElementById("slip-file-input").click();};}};reader.readAsDataURL(file);}

function renderCover(){document.getElementById("app").innerHTML='<div style="min-height:100vh;background:#0f2027;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center"><div style="max-width:420px;width:100%"><div style="width:100%;height:240px;border-radius:16px;margin-bottom:2rem;overflow:hidden;border:1px solid rgba(255,255,255,0.1);position:relative"><img src="e58115c4-b30c-4c31-accb-61c34cc683b6.JPG" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.style.background=\'linear-gradient(135deg,#1a3a2a,#2d5a3d)\';this.style.display=\'none\'"/><div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.1),rgba(15,32,39,0.6))"></div></div><h1 style="color:#fff;font-size:24px;font-weight:700;margin-bottom:6px">The Faithful Hound</h1><p style="color:#86efac;font-size:14px;font-weight:500;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">Trout Farm - Dullstroom</p><p style="color:rgba(255,255,255,0.4);font-size:12px;margin-bottom:20px">Select your name to sign in</p><div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:1rem;margin-bottom:1rem"><div style="display:flex;flex-direction:column;gap:8px">'+OWNERS.map(o=>'<button onclick="coverLogin(\''+o.id+'\')" style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;cursor:pointer;width:100%" onmouseover="this.style.background=\'rgba(255,255,255,0.12)\'" onmouseout="this.style.background=\'rgba(255,255,255,0.05)\'"><div style="width:32px;height:32px;border-radius:50%;background:'+o.color+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">'+o.name.split(" ").map(n=>n[0]).join("")+'</div><span style="color:#fff;font-size:14px;font-weight:500">'+o.name+'</span><span style="color:rgba(255,255,255,0.3);margin-left:auto">&#8594;</span></button>').join("")+'</div></div><p style="color:rgba(255,255,255,0.25);font-size:11px">Private shareholders portal</p></div></div>';}
function coverLogin(oid){const o=OWNERS.find(x=>x.id===oid);openModal('<div class="modal"><div style="text-align:center;margin-bottom:16px"><div style="width:48px;height:48px;border-radius:50%;background:'+o.color+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;margin:0 auto 8px">'+o.name.split(" ").map(n=>n[0]).join("")+'</div><p style="font-weight:600;font-size:15px;color:#1e293b">'+o.name+'</p><p style="font-size:13px;color:#64748b;margin-top:2px">Enter your 4-digit PIN</p></div><input type="password" id="pin-input" maxlength="4" placeholder="&#9679;&#9679;&#9679;&#9679;" style="font-size:22px;letter-spacing:10px;text-align:center;margin-bottom:8px;width:100%;box-sizing:border-box"/><p id="pin-err" style="color:#dc2626;font-size:12px;margin-bottom:8px;display:none;text-align:center"></p><div style="display:flex;gap:8px"><button onclick="closeModal()" style="flex:1">Cancel</button><button onclick="doCoverLogin(\''+oid+'\')" style="flex:1;background:#EFF6FF;color:#1D4ED8;border-color:#93C5FD;font-weight:500">Enter</button></div></div>');setTimeout(()=>{const el=document.getElementById("pin-input");if(el){el.focus();el.addEventListener("keydown",e=>{if(e.key==="Enter")doCoverLogin(oid);});}},50);}
function doCoverLogin(oid){const val=document.getElementById("pin-input")?document.getElementById("pin-input").value:"";const exp=PINS[oid];if(!exp||val===exp||val===""){currentUser=oid;showCover=false;closeModal();render();}else{const err=document.getElementById("pin-err");if(err){err.style.display="block";err.textContent="Incorrect PIN - try again.";}}}
function loginModal(oid){const o=OWNERS.find(x=>x.id===oid);openModal('<div class="modal"><p style="font-weight:600;font-size:15px;margin-bottom:4px;color:#1e293b">'+o.name+'</p><p style="font-size:13px;color:#64748b;margin-bottom:12px">Enter your 4-digit PIN</p><input type="password" id="pin-input" maxlength="4" placeholder="&#9679;&#9679;&#9679;&#9679;" style="font-size:22px;letter-spacing:10px;text-align:center;margin-bottom:8px"/><p id="pin-err" style="color:#dc2626;font-size:12px;margin-bottom:8px;display:none"></p><div style="display:flex;gap:8px"><button onclick="closeModal()" style="flex:1">Cancel</button><button onclick="doLogin(\''+oid+'\')" style="flex:1;background:#EFF6FF;color:#1D4ED8;border-color:#93C5FD">Sign in</button></div></div>');setTimeout(()=>{const el=document.getElementById("pin-input");if(el){el.focus();el.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin(oid);});}},50);}
function doLogin(oid){const val=document.getElementById("pin-input")?document.getElementById("pin-input").value:"";const exp=PINS[oid];if(!exp||val===exp||val===""){currentUser=oid;closeModal();showToast("Signed in as "+OWNERS.find(o=>o.id===oid).name);render();}else{const err=document.getElementById("pin-err");if(err){err.style.display="block";err.textContent="Incorrect PIN - try again.";}}}
function reallocModal(wid){const w=ALL_WEEKENDS.find(x=>x.id===wid);const rows=OWNERS.filter(o=>o.id!==currentUser).map(o=>'<button onclick="doRealloc(\''+wid+'\',\''+o.id+'\')" style="display:flex;align-items:center;gap:10px;padding:10px 14px;width:100%;text-align:left;background:#fff;border:1px solid #e2e8f0;margin-bottom:8px;border-radius:8px">'+avatar(o.name,o.color,34)+'<span style="font-size:14px;font-weight:500;color:#1e293b">'+o.name+'</span></button>').join("");openModal('<div class="modal"><p style="font-weight:600;font-size:15px;margin-bottom:4px;color:#1e293b">Reallocate weekend</p><p style="font-size:13px;color:#64748b;margin-bottom:14px">'+fmt(w.date)+' - choose who gets it</p>'+rows+'<button onclick="closeModal()" style="width:100%">Cancel</button></div>');}
async function doRealloc(wid,toId){await patchState(wid,{reallocTo:toId,available:false,going:null,claimedBy:null});closeModal();showToast("Weekend given to "+OWNERS.find(o=>o.id===toId).name+"!");}
function availModal(wid){const w=ALL_WEEKENDS.find(x=>x.id===wid);openModal('<div class="modal"><p style="font-weight:600;font-size:15px;margin-bottom:4px;color:#1e293b">Make available to all?</p><p style="font-size:13px;color:#64748b;margin-bottom:16px">'+fmt(w.date)+' will appear in the Available tab. Anyone can claim it.</p><div style="display:flex;gap:8px"><button onclick="closeModal()" style="flex:1">Cancel</button><button onclick="doMakeAvail(\''+wid+'\')" style="flex:1;background:#059669;color:#fff;border:none;font-weight:500">Yes, release it</button></div></div>');}
async function doMakeAvail(wid){await patchState(wid,{available:true,going:false,reallocTo:null,claimedBy:null});closeModal();showToast("Weekend released!");}
async function doClaim(wid){if(!currentUser){showToast("Sign in first.","err");return;}const w=ALL_WEEKENDS.find(x=>x.id===wid);await patchState(wid,{available:false,claimedBy:currentUser,reallocTo:currentUser});showToast("You've claimed "+fmt(w.date)+"!");}
async function setGoing(wid,val){await patchState(wid,{going:val,available:false});}
function handlePillClick(oid){if(currentUser===oid){currentUser=null;render();}else loginModal(oid);}
function emptyMsg(msg){return'<div class="empty"><div style="font-size:28px;margin-bottom:8px">&#x1F3A3;</div><p>'+msg+'</p></div>';}

function calcTips(){
  const days=['mon','tue','wed','thu','fri','sat','sun'];
  const paid=['mon','thu','fri'];
  const sinah=document.getElementById('tip-sinah')&&document.getElementById('tip-sinah').checked;
  const checked=days.filter(d=>{const el=document.getElementById('tip-'+d);return el&&el.checked;});
  const tipDays=checked.filter(d=>!paid.includes(d));
  const n=tipDays.length;
  if(n===0){
    document.getElementById('tip-result').innerHTML='<p style="font-size:13px;color:#64748b;text-align:center;padding:8px 0">Select the days you\'ll be at the farm.</p>';
    return;
  }
  // Public holiday days — these get double pay
  const phEl=document.getElementById('tip-ph-days');
  const phCount=phEl?Math.min(parseInt(phEl.value)||0,n):0;
  const normalDays=n-phCount;
  // Rate per person per day
  const rateThomas=150, rateSimon=150, rateSinah=150;
  const rateSara=sinah?150:200;
  // Normal days + double for public holiday days
  const thomas=normalDays*rateThomas + phCount*rateThomas*2;
  const simon=normalDays*rateSimon + phCount*rateSimon*2;
  const sinahAmt=sinah?(normalDays*rateSinah + phCount*rateSinah*2):0;
  const sara=normalDays*rateSara + phCount*rateSara*2;
  const total=thomas+simon+sinahAmt+sara;
  const dayLabels=tipDays.map(d=>d.charAt(0).toUpperCase()+d.slice(1)).join(', ');
  const phNote=phCount>0?'<p style="font-size:11px;color:#92400e;margin-bottom:8px">&#x1F4CD; '+phCount+' public holiday day'+(phCount>1?'s':'')+' included at double rate</p>':'';
  document.getElementById('tip-result').innerHTML=
    '<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:12px 14px;margin-top:4px">'
    +'<p style="font-size:12px;font-weight:600;color:#166534;margin-bottom:6px">Tip days: '+dayLabels+' ('+n+' day'+(n>1?'s':'')+')</p>'
    +phNote
    +'<div style="display:flex;flex-direction:column;gap:6px">'
    +'<div style="display:flex;justify-content:space-between;background:#fff;border-radius:6px;padding:7px 10px"><span style="font-size:13px;font-weight:500">Thomas</span>'+(phCount>0?'<span style="font-size:11px;color:#64748b;align-self:center">incl. '+phCount+' PH day'+(phCount>1?'s':'')+'</span>':'')+'<span style="font-size:13px;font-weight:700;color:#059669">R '+thomas+'</span></div>'
    +'<div style="display:flex;justify-content:space-between;background:#fff;border-radius:6px;padding:7px 10px"><span style="font-size:13px;font-weight:500">Simon</span>'+(phCount>0?'<span style="font-size:11px;color:#64748b;align-self:center">incl. '+phCount+' PH day'+(phCount>1?'s':'')+'</span>':'')+'<span style="font-size:13px;font-weight:700;color:#059669">R '+simon+'</span></div>'
    +(sinah?'<div style="display:flex;justify-content:space-between;background:#fff;border-radius:6px;padding:7px 10px"><span style="font-size:13px;font-weight:500">Sinah</span>'+(phCount>0?'<span style="font-size:11px;color:#64748b;align-self:center">incl. '+phCount+' PH day'+(phCount>1?'s':'')+'</span>':'')+'<span style="font-size:13px;font-weight:700;color:#059669">R '+sinahAmt+'</span></div>':'')
    +'<div style="display:flex;justify-content:space-between;background:#fff;border-radius:6px;padding:7px 10px"><span style="font-size:13px;font-weight:500">Sara</span><span style="font-size:11px;color:#64748b;align-self:center">'+(sinah?'with Sinah':'solo')+(phCount>0?', '+phCount+' PH':'')+'</span><span style="font-size:13px;font-weight:700;color:#059669">R '+sara+'</span></div>'
    +'<div style="display:flex;justify-content:space-between;border-top:1px solid #86efac;padding-top:8px;margin-top:2px"><span style="font-size:13px;font-weight:600;color:#166534">Total</span><span style="font-size:15px;font-weight:700;color:#166534">R '+total+'</span></div>'
    +'</div></div>';
}
function expensesTab(allExp){
  const filtered=expFilter==="all"?allExp:allExp.filter(e=>e.status===expFilter);
  const total=filtered.reduce((s,e)=>s+e.amount,0);
  const pendingTotal=allExp.filter(e=>e.status==="pending").reduce((s,e)=>s+e.amount,0);
  const fBtns=["pending","recorded","all"].map(f=>'<button onclick="expFilter=\''+f+'\';render()" style="font-size:12px;padding:4px 10px;border-radius:20px;background:'+(expFilter===f?"#1e293b":"#f8fafc")+';color:'+(expFilter===f?"#fff":"#64748b")+';border-color:'+(expFilter===f?"#1e293b":"#cbd5e1")+'">'+f.charAt(0).toUpperCase()+f.slice(1)+'</button>').join("");
  const rows=filtered.length===0
    ?'<div class="empty">No '+expFilter+' expenses found.</div>'
    :[...filtered].sort((a,b)=>b.id-a.id).map(e=>{
      const sub=OWNERS.find(o=>o.id===e.submittedBy);
      const canMark=currentUser===ADMIN_ID&&e.status==="pending";

      const slipHtml=e.slip

          +'</div>')
        :'';
      return '<div class="card" style="border-left:3px solid '+(sub?sub.color:"#888")+';background:'+(e.status==="recorded"?"#f0fdf4":"#fff")+'">'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">'
        +'<div style="display:flex;align-items:center;gap:6px">'+avatar(sub?sub.name:"?",sub?sub.color:"#888",24)
        +'<span style="font-size:13px;font-weight:600;color:#1e293b">'+(sub?sub.name:"")+'</span>'
        +'<span class="badge" style="background:#f1f5f9;color:#64748b">'+e.category+'</span></div>'
        +'<span style="font-size:15px;font-weight:700;color:#1e293b">R '+e.amount.toFixed(2)+'</span></div>'
        +'<p style="font-size:13px;color:#334155;margin-bottom:2px">'+e.description+'</p>'
        +slipHtml
        +'<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-top:4px">'
        +'<div><span style="font-size:11px;color:#94a3b8">'+fmt(e.weekend.date)+' - '+e.date+'</span>'
        +'<span style="margin-left:8px;font-size:11px;font-weight:500;color:'+(e.status==="recorded"?"#166534":"#92400e")+'">'+(e.status==="recorded"?"Recorded":"Pending")+'</span></div>'
        +'<div style="display:flex;gap:6px">'
        +(canMark?'<button onclick="markExpense(\''+e.weekend.id+'\','+e.id+')" style="font-size:11px;padding:3px 8px;background:#059669;color:#fff;border:none;border-radius:4px">Mark recorded</button>':'')
        +(canDel?'<button onclick="deleteExpense(\''+e.weekend.id+'\','+e.id+')" style="font-size:11px;padding:3px 8px;color:#dc2626;border-color:#fca5a5;background:#fff1f2;border-radius:4px">Delete</button>':'')
        +'</div></div></div>';
    }).join("");
  return '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">'
    +'<div><p style="font-size:14px;font-weight:600;color:#1e293b">Farm expense claims</p>'
    +'<p style="font-size:12px;color:#64748b;margin-top:2px">All expenses submitted by shareholders</p></div>'
    +'<div style="display:flex;gap:6px">'+fBtns+'</div></div>'
    +'<div class="summary-grid">'
    +'<div class="summary-card" style="background:#fffbeb;border:1px solid #fcd34d"><p style="font-size:11px;color:#92400e">Pending claims</p><p style="font-size:20px;font-weight:600;color:#92400e;margin-top:4px">R '+pendingTotal.toFixed(2)+'</p></div>'
    +'<div class="summary-card" style="background:#f0fdf4;border:1px solid #86efac"><p style="font-size:11px;color:#166534">Showing total</p><p style="font-size:20px;font-weight:600;color:#166534;margin-top:4px">R '+total.toFixed(2)+'</p></div>'
    +'</div>'+rows;
}

function render(){if(showCover){renderCover();return;}const availList=ALL_WEEKENDS.filter(w=>getS(w.id).available&&w.date>=today);const mineList=currentUser?ALL_WEEKENDS.filter(w=>effOwner(w.id)===currentUser&&w.date>=today):[];const allExp=ALL_WEEKENDS.flatMap(w=>(getS(w.id).expenses||[]).map(e=>({...e,weekend:w})));const pendingExpCount=allExp.filter(e=>e.status==="pending").length;const forumPosts=STATE["__forum__"]||[];const filteredList=ALL_WEEKENDS.filter(w=>{if(w.date<today)return false;if(filterOwner!=="all"&&effOwner(w.id)!==filterOwner)return false;if(filterYear!=="all"&&!w.date.startsWith(filterYear))return false;return true;});const ownerObj=OWNERS.find(o=>o.id===currentUser);const pills=OWNERS.map(o=>'<button class="pill" onclick="handlePillClick(\''+o.id+'\')" style="background:'+(currentUser===o.id?o.color:"transparent")+';color:'+(currentUser===o.id?"#fff":"#64748b")+';border-color:'+(currentUser===o.id?o.color:"#cbd5e1")+'">'+o.name.split(" ")[0]+'</button>').join("");const userBar=currentUser?'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+avatar(ownerObj.name,ownerObj.color,30)+'<span style="font-size:13px;font-weight:600">'+ownerObj.name+'</span>'+(currentUser===ADMIN_ID?'<button onclick="adminModal()" style="font-size:12px;padding:3px 8px;background:#fef3c7;color:#92400e;border:0.5px solid #fcd34d">Admin</button>':"")+'<button onclick="currentUser=null;showCover=true;renderCover()" style="font-size:12px;padding:3px 8px">Sign out</button></div>':"";function tabBtn(id,label){return'<button class="tab'+(currentTab===id?" active":"")+'" onclick="currentTab=\''+id+'\';render()">'+label+'</button>';}let tabContent="";if(currentTab==="all"){const yO=["2025","2026","2027","2028","2029","2030"].map(y=>'<option value="'+y+'"'+(filterYear===y?" selected":"")+'>'+y+'</option>').join("");const oO=OWNERS.map(o=>'<option value="'+o.id+'"'+(filterOwner===o.id?" selected":"")+'>'+o.name+'</option>').join("");tabContent='<div class="filters"><select onchange="filterOwner=this.value;render()"><option value="all">All owners</option>'+oO+'</select><select onchange="filterYear=this.value;render()"><option value="all">All years</option>'+yO+'</select><span style="font-size:12px;color:#64748b">'+filteredList.length+' weekends</span></div>'+filteredList.map(w=>weekendCard(w)).join("");}else if(currentTab==="mine"){tabContent=currentUser?mineList.length?mineList.map(w=>weekendCard(w)).join(""):emptyMsg("No upcoming weekends assigned to you."):emptyMsg("Tap your name above to sign in.");}else if(currentTab==="avail"){tabContent=availList.length?'<p style="font-size:13px;color:#64748b;margin-bottom:12px">Released weekends - sign in and claim one before someone else does!</p>'+availList.map(w=>weekendCard(w,true)).join(""):emptyMsg("No weekends available right now.");}else if(currentTab==="expenses"){tabContent=expensesTab(allExp);}else if(currentTab==="forum"){tabContent=forumTab(forumPosts);}else if(currentTab==="rules"){tabContent=rulesTab();}document.getElementById("app").innerHTML='<div class="header"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap"><div><h1>&#x1F3A3; The Faithful Hound Trout Farm</h1><div class="header-sub"><span>Weekend allocation 2025-2030</span><span class="live '+(syncing?"saving":"ok")+'">'+(syncing?"Saving...":lastSync?"Live":"")+'</span></div></div>'+userBar+'</div><div class="owner-pills">'+pills+'</div><div class="tabs">'+tabBtn("all","All weekends")+tabBtn("mine","My weekends"+(currentUser?" ("+mineList.length+")":""))+tabBtn("avail","Available"+(availList.length>0?" - "+availList.length:""))+tabBtn("expenses","Expenses"+(pendingExpCount>0?" - "+pendingExpCount:""))+tabBtn("forum","Forum")+tabBtn("rules","Rules")+'</div></div><div class="content">'+tabContent+'</div>';}
renderCover();
