<!DOCTYPE html>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }
    .app { max-width: 720px; margin: 0 auto; padding: 0 0 3rem; background: #fff; min-height: 100vh; box-shadow: 0 0 0 0.5px #e2e8f0; }
    button { font-family: inherit; cursor: pointer; border-radius: 6px; border: 0.5px solid #cbd5e1; background: transparent; color: #475569; font-size: 13px; padding: 5px 10px; transition: background 0.15s; }
    button:hover { background: #f1f5f9; }
    input, select, textarea { font-family: inherit; font-size: 13px; border: 0.5px solid #cbd5e1; border-radius: 6px; padding: 7px 10px; width: 100%; outline: none; background: #fff; color: #1e293b; }
    input:focus, select:focus, textarea:focus { border-color: #93c5fd; box-shadow: 0 0 0 2px #dbeafe; }
    .header { padding: 1rem 1rem 0; }
    .header h1 { font-size: 17px; font-weight: 600; }
    .header-sub { font-size: 12px; color: #64748b; margin-top: 2px; display: flex; align-items: center; gap: 8px; }
    .owner-pills { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 12px; }
    .pill { font-size: 12px; padding: 4px 12px; border-radius: 20px; cursor: pointer; border: 0.5px solid #cbd5e1; }
    .tabs { display: flex; border-bottom: 0.5px solid #e2e8f0; overflow-x: auto; }
    .tab { font-size: 13px; padding: 8px 12px; border: none; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; white-space: nowrap; }
    .tab.active { border-bottom-color: #1e293b; font-weight: 500; color: #1e293b; }
    .content { padding: 1rem; }
    .card { background: #fff; border: 0.5px solid #e2e8f0; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
    .badge { font-size: 11px; border-radius: 10px; padding: 1px 7px; display: inline-flex; align-items: center; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 1rem; }
    .modal { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; width: 100%; max-width: 400px; max-height: 85vh; overflow-y: auto; }
    .modal.wide { max-width: 440px; }
    .avatar { border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; flex-shrink: 0; }
    .toast { position: fixed; top: 12px; right: 12px; z-index: 9999; border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 500; max-width: 280px; animation: fadein 0.2s; }
    @keyframes fadein { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .live { font-size: 11px; }
    .live.ok { color: #059669; }
    .live.saving { color: #d97706; }
    .filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .filters select { width: auto; }
    .expense-row { border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .empty { text-align: center; padding: 2rem 1rem; color: #94a3b8; font-size: 14px; }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .summary-card { border-radius: 8px; padding: 10px 14px; }
    @media (max-width: 500px) { .card-actions { flex-wrap: wrap; } }
  </style>
</head>

const ALL_WEEKENDS = RAW.flatMap(([rnd,...dates])=>OID.map((oid,i)=>({id:`${rnd}-${oid}`,round:rnd,origOwner:oid,date:dates[i]}))).sort((a,b)=>a.date.localeCompare(b.date));
function nearHoliday(d){const dt=new Date(d+"T00:00:00");for(let i=-1;i<=2;i++){const c=new Date(dt);c.setDate(dt.getDate()+i);const k=String(c.getMonth()+1).padStart(2,"0")+"-"+String(c.getDate()).padStart(2,"0");if(HOLIDAYS[k])return HOLIDAYS[k];}return null;}
function fmt(d){return new Date(d+"T00:00:00").toLocaleDateString("en-ZA",{day:"numeric",month:"short",year:"numeric"});}
function avatar(name,color,size=28){const initials=name.split(" ").map(n=>n[0]).join("");return `<div class="avatar" style="width:${size}px;height:${size}px;background:${color};font-size:${size<30?10:12}px">${initials}</div>`;}
let STATE={};let PINS={...DEFAULT_PINS};let currentUser=null;let currentTab="all";let filterOwner="all";let filterYear="all";let syncing=false;let lastSync=null;let expFilter="pending";let showCover=true;
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const stateRef=db.ref("farmState");
const pinsRef=db.ref("farmPins");
stateRef.on("value",snap=>{const val=snap.val();if(val)STATE=val;if(!showCover)render();});
pinsRef.on("value",snap=>{const val=snap.val();if(val)PINS=val;if(!showCover)render();});
function getS(id){return STATE[id]||{going:null,available:false,claimedBy:null,reallocTo:null,comments:[],expenses:[]};}
async function patchState(id,p){const updated={...getS(id),...p};STATE[id]=updated;syncing=true;render();await stateRef.child(id).set(updated);syncing=false;lastSync=new Date();render();}
async function savePins(updated){PINS=updated;await pinsRef.set(updated);}
function effOwner(id){const s=getS(id);if(s.reallocTo)return s.reallocTo;if(s.claimedBy)return s.claimedBy;return ALL_WEEKENDS.find(x=>x.id===id)?.origOwner||null;}
const today=new Date().toISOString().split("T")[0];
function renderCover(){
  document.getElementById("app").innerHTML=`
    <div style="min-height:100vh;background:#0f2027;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center">
      <div style="max-width:420px;width:100%">
        <div style="width:100%;height:220px;background:linear-gradient(135deg,#1a3a2a,#2d5a3d);border-radius:16px;margin-bottom:2rem;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(255,255,255,0.1)">
          <div style="font-size:64px">🎣</div>
        </div>
        <h1 style="color:#fff;font-size:24px;font-weight:700;margin-bottom:6px;letter-spacing:-0.5px">The Faithful Hound</h1>

                <div style="width:32px;height:32px;border-radius:50%;background:${o.color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">${o.name.split(" ").map(n=>n[0]).join("")}</div>
                <span style="color:#fff;font-size:14px;font-weight:500">${o.name}</span>
                <span style="color:rgba(255,255,255,0.3);font-size:12px;margin-left:auto">→</span>
              </button>`).join("")}
          </div>
        </div>
        <p style="color:rgba(255,255,255,0.25);font-size:11px">Private shareholders portal</p>

}

function coverLogin(oid){
  const o=OWNERS.find(x=>x.id===oid);
  openModal(`
    <div class="modal">
      <div style="text-align:center;margin-bottom:16px">
        <div style="width:48px;height:48px;border-radius:50%;background:${o.color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;margin:0 auto 8px">${o.name.split(" ").map(n=>n[0]).join("")}</div>
        <p style="font-weight:600;font-size:15px;color:#1e293b">${o.name}</p>
        <p style="font-size:13px;color:#64748b;margin-top:2px">Enter your 4-digit PIN</p>
      </div>
      <input type="password" id="pin-input" maxlength="4" placeholder="••••"
        style="font-size:22px;letter-spacing:10px;text-align:center;margin-bottom:8px;width:100%;box-sizing:border-box"/>
      <p id="pin-err" style="color:#dc2626;font-size:12px;margin-bottom:8px;display:none;text-align:center"></p>
      <div style="display:flex;gap:8px">
        <button onclick="closeModal()" style="flex:1">Cancel</button>
        <button onclick="doCoverLogin('${oid}')" style="flex:1;background:#EFF6FF;color:#1D4ED8;border-color:#93C5FD;font-weight:500">Enter</button>
      </div>
    </div>`);
  setTimeout(()=>{
    const el=document.getElementById("pin-input");
    if(el){el.focus();el.addEventListener("keydown",e=>{if(e.key==="Enter")doCoverLogin(oid);});}
  },50);
}

function doCoverLogin(oid){
  const val=document.getElementById("pin-input")?.value||"";
  const exp=PINS[oid];
  if(!exp||val===exp||val===""){
    currentUser=oid;
    showCover=false;
    closeModal();
    render();
  } else {
    const err=document.getElementById("pin-err");
    if(err){err.style.display="block";err.textContent="Incorrect PIN — try again.";}
  }
}const existing=document.getElementById("toast");if(existing)existing.remove();const el=document.createElement("div");el.id="toast";el.className="toast";el.style.background=type==="ok"?"#dcfce7":"#fee2e2";el.style.color=type==="ok"?"#166534":"#991b1b";el.style.border=`0.5px solid ${type==="ok"?"#86efac":"#fca5a5"}`;el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3500);}
function closeModal(){const m=document.getElementById("modal-overlay");if(m)m.remove();}
function openModal(html){closeModal();const overlay=document.createElement("div");overlay.className="modal-overlay";overlay.id="modal-overlay";overlay.innerHTML=html;overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal();});document.body.appendChild(overlay);}
function loginModal(oid){const o=OWNERS.find(x=>x.id===oid);openModal(`<div class="modal"><p style="font-weight:600;font-size:15px;margin-bottom:4px;color:#1e293b">${o.name}</p><p style="font-size:13px;color:#64748b;margin-bottom:12px">Enter your 4-digit PIN</p><input type="password" id="pin-input" maxlength="4" placeholder="••••" style="font-size:22px;letter-spacing:10px;text-align:center;margin-bottom:8px"/><p id="pin-err" style="color:#dc2626;font-size:12px;margin-bottom:8px;display:none"></p><div style="display:flex;gap:8px"><button onclick="closeModal()" style="flex:1">Cancel</button><button onclick="doLogin('${oid}')" style="flex:1;background:#EFF6FF;color:#1D4ED8;border-color:#93C5FD">Sign in</button></div></div>`);setTimeout(()=>{const el=document.getElementById("pin-input");if(el){el.focus();el.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin(oid);});}},50);}
function doLogin(oid){const val=document.getElementById("pin-input")?.value||"";const exp=PINS[oid];if(!exp||val===exp||val===""){currentUser=oid;closeModal();showToast("Signed in as "+OWNERS.find(o=>o.id===oid).name);render();}else{const err=document.getElementById("pin-err");if(err){err.style.display="block";err.textContent="Incorrect PIN — try again.";}}}
function reallocModal(wid){const w=ALL_WEEKENDS.find(x=>x.id===wid);const rows=OWNERS.filter(o=>o.id!==currentUser).map(o=>`<button onclick="doRealloc('${wid}','${o.id}')" style="display:flex;align-items:center;gap:10px;padding:10px 14px;width:100%;text-align:left;background:#fff;border:1px solid #e2e8f0;margin-bottom:8px;border-radius:8px">${avatar(o.name,o.color,34)}<span style="font-size:14px;font-weight:500;color:#1e293b">${o.name}</span></button>`).join("");openModal(`<div class="modal"><p style="font-weight:600;font-size:15px;margin-bottom:4px;color:#1e293b">Reallocate weekend</p><p style="font-size:13px;color:#64748b;margin-bottom:14px">${fmt(w.date)} — choose who gets it</p>${rows}<button onclick="closeModal()" style="width:100%">Cancel</button></div>`);}
async function doRealloc(wid,toId){await patchState(wid,{reallocTo:toId,available:false,going:null,claimedBy:null});closeModal();showToast("Weekend given to "+OWNERS.find(o=>o.id===toId).name+"!");}
function availModal(wid){const w=ALL_WEEKENDS.find(x=>x.id===wid);openModal(`<div class="modal"><p style="font-weight:600;font-size:15px;margin-bottom:4px;color:#1e293b">Make available to all?</p><p style="font-size:13px;color:#64748b;margin-bottom:16px">${fmt(w.date)} will appear in the Available tab. Anyone can claim it — first come, first served.</p><div style="display:flex;gap:8px"><button onclick="closeModal()" style="flex:1">Cancel</button><button onclick="doMakeAvail('${wid}')" style="flex:1;background:#059669;color:#fff;border:none;font-weight:500">Yes, release it</button></div></div>`);}
async function doMakeAvail(wid){await patchState(wid,{available:true,going:false,reallocTo:null,claimedBy:null});closeModal();showToast("Weekend released — first come, first served!");}

ght;padding-top:4px;border-top:0.5px solid #e2e8f0;font-size:13px;font-weight:600;color:#1e293b">Total: R ${total.toFixed(2)}</div>`:"";const catOptions=CATS.map(c=>`<option value="${c}">${c.charAt(0).toUpperCase()+c.slice(1)}</option>`).join("");const inputArea=currentUser?`<div style="border-top:0.5px solid #e2e8f0;padding-top:12px;display:flex;flex-direction:column;gap:8px"><p style="font-size:12px;font-weight:600;color:#1e293b">Log an expense</p><div style="display:flex;gap:8px"><input type="number" id="exp-amount" min="0" step="0.01" placeholder="Amount (R)" style="width:110px"/><select id="exp-cat" style="flex:1">${catOptions}</select></div><div style="display:flex;gap:8px"><input type="text" id="exp-desc" placeholder="Description (e.g. Petrol on the way up)" style="flex:1"/><button onclick="postExpense('${wid}')" style="font-size:13px;padding:0 14px;background:#D97706;color:#fff;border:none;border-radius:6px;font-weight:500;flex-shrink:0">Log</button></div></div>`:`<p style="font-size:12px;color:#64748b;text-align:center;padding-top:8px;border-top:0.5px solid #e2e8f0">Sign in to log an expense.</p>`;openModal(`<div class="modal wide"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px"><p style="font-weight:600;font-size:15px;color:#1e293b">💰 Expenses</p><button onclick="closeModal()">Close</button></div><p style="font-size:12px;color:#64748b;margin-bottom:12px">${fmt(w.date)}</p><div style="max-height:260px;overflow-y:auto;margin-bottom:4px">${rows}${totalRow}</div>${inputArea}</div>`);setTimeout(()=>{const el=document.getElementById("exp-desc");if(el)el.addEventListener("keydown",e=>{if(e.key==="Enter")postExpense(wid);});},50);}
async function postExpense(wid){const amount=parseFloat(document.getElementById("exp-amount")?.value||"0");const desc=(document.getElementById("exp-desc")?.value||"").trim();const cat=document.getElementById("exp-cat")?.value||"general";if(!amount||!desc||!currentUser){showToast("Please fill in amount and description.","err");return;}const existing=getS(wid).expenses||[];const ne={id:Date.now(),submittedBy:currentUser,amount,description:desc,category:cat,date:new Date().toLocaleString("en-ZA",{day:"numeric",month:"short",year:"numeric"}),status:"pending"};await patchState(wid,{expenses:[...existing,ne]});closeModal();showToast("Expense logged — Steve will record it.");}

async function postForumMessage(){
  const el=document.getElementById("forum-text");
  const text=(el?.value||"").trim();
  if(!text||!currentUser){showToast("Sign in and write a message first.","err");return;}
  const existing=STATE["__forum__"]||[];
  const np={
    id:Date.now(),authorId:currentUser,text,
    time:new Date().toLocaleString("en-ZA",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})
  };
  STATE["__forum__"]=[...existing,np];
  await stateRef.child("__forum__").set(STATE["__forum__"]);
  showToast("Message posted!");
  render();
}

async function deleteForumPost(pid){
  const existing=STATE["__forum__"]||[];
  STATE["__forum__"]=existing.filter(p=>p.id!==pid);
  await stateRef.child("__forum__").set(STATE["__forum__"]);
  render();
}

}const filtered=expFilter==="all"?allExp:allExp.filter(e=>e.status===expFilter);const total=filtered.reduce((s,e)=>s+e.amount,0);const pendingTotal=allExp.filter(e=>e.status==="pending").reduce((s,e)=>s+e.amount,0);const filterBtns=["pending","recorded","all"].map(f=>`<button onclick="expFilter='${f}';render()" style="font-size:12px;padding:4px 10px;border-radius:20px;background:${expFilter===f?"#1e293b":"#f8fafc"};color:${expFilter===f?"#fff":"#64748b"};border-color:${expFilter===f?"#1e293b":"#cbd5e1"}">${f.charAt(0).toUpperCase()+f.slice(1)}</button>`).join("");const rows=filtered.length===0?`<div class="empty">No ${expFilter} expenses found.</div>`:[...filtered].sort((a,b)=>b.id-a.id).map(e=>{const sub=OWNERS.find(o=>o.id===e.submittedBy);const canMark=currentUser===ADMIN_ID&&e.status==="pending";const canDel=e.submittedBy===currentUser||currentUser===ADMIN_ID;return`<div class="card" style="border-left:3px solid ${sub?.color||"#888"};background:${e.status==="recorded"?"#f0fdf4":"#fff"}"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px"><div style="display:flex;align-items:center;gap:6px">${avatar(sub?.name||"?",sub?.color||"#888",24)}<span style="font-size:13px;font-weight:600;color:#1e293b">${sub?.name}</span><span class="badge" style="background:#f1f5f9;color:#64748b">${e.category}</span></div><span style="font-size:15px;font-weight:700;color:#1e293b">R ${e.amount.toFixed(2)}</span></div><p style="font-size:13px;color:#334155;margin-bottom:4px">${e.description}</p><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px"><div><span style="font-size:11px;color:#94a3b8">${fmt(e.weekend.date)} · ${e.date}</span><span style="margin-left:8px;font-size:11px;font-weight:500;color:${e.status==="recorded"?"#166534":"#92400e"}">${e.status==="recorded"?"✓ Recorded":"⏳ Pending"}</span></div><div style="display:flex;gap:6px">${canMark?`<button onclick="markExpense('${e.weekend.id}',${e.id})" style="font-size:11px;padding:3px 8px;background:#059669;color:#fff;border:none;border-radius:4px">Mark recorded</button>`:""}${canDel?`<button onclick="deleteExpense('${e.weekend.id}',${e.id})" style="font-size:11px;padding:3px 8px;color:#dc2626;border-color:#fca5a5;background:#fff1f2;border-radius:4px">Delete</button>`:""}</div></div></div>`;}).join("");return`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px"><div><p style="font-size:14px;font-weight:600;color:#1e293b">Farm expense claims</p><p style="font-size:12px;color:#64748b;margin-top:2px">All expenses submitted by shareholders</p></div><div style="display:flex;gap:6px">${filterBtns}</div></div><div class="summary-grid"><div class="summary-card" style="background:#fffbeb;border:1px solid #fcd34d"><p style="font-size:11px;color:#92400e">Pending claims</p><p style="font-size:20px;font-weight:600;color:#92400e;margin-top:4px">R ${pendingTotal.toFixed(2)}</p></div><div class="summary-card" style="background:#f0fdf4;border:1px solid #86efac"><p style="font-size:11px;color:#166534">Showing total</p><p style="font-size:20px;font-weight:600;color:#166534;margin-top:4px">R ${total.toFixed(2)}</p></div></div>${rows}`;}
</script>
